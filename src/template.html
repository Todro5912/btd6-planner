<title>Bloons Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a sticky control rail on the left, results stacked summary-first on the right; one column under 900px. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --ink: #141A2B;
  --muted: #5A6378;
  --line: #D5DBE6;
  --accent: #2147B5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8FB;
  --cash: #C98B00;
  --cash-soft: rgba(229, 168, 18, .18);
  --ok: #24804F;
  --ok-soft: #DDF1E5;
  --warn: #A86A00;
  --warn-soft: #FBEFD3;
  --crit: #CC2A35;
  --crit-soft: #FBE1E3;
  --bronze: #A8642B;
  --silver: #7D8794;
  --gold: #B98A00;
  --diamond: #2A8FB5;
  --black-medal: #161616;
  --path-1: #2147B5;
  --path-2: #8A3FB8;
  --path-3: #1E8A72;
  --shadow: 0 1px 2px rgba(20, 26, 43, .06), 0 4px 16px rgba(20, 26, 43, .05);
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1120; --surface: #151A2B; --surface-2: #1B2135; --ink: #E6E9F2; --muted: #98A0B6; --line: #2A3150;
    --accent: #8EA6FF; --accent-ink: #0D1120; --accent-soft: #232C4E;
    --cash: #F1C24A; --cash-soft: rgba(241, 194, 74, .16);
    --ok: #5CCB8E; --ok-soft: #173326; --warn: #F0B54A; --warn-soft: #3A2C10; --crit: #FF6B73; --crit-soft: #3D1A20;
    --bronze: #D8925A; --silver: #B5BDC8; --gold: #E9C048; --diamond: #6CC8EA; --black-medal: #E8E8E8;
    --path-1: #8EA6FF; --path-2: #C792EA; --path-3: #5FD3B6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1120; --surface: #151A2B; --surface-2: #1B2135; --ink: #E6E9F2; --muted: #98A0B6; --line: #2A3150;
  --accent: #8EA6FF; --accent-ink: #0D1120; --accent-soft: #232C4E;
  --cash: #F1C24A; --cash-soft: rgba(241, 194, 74, .16);
  --ok: #5CCB8E; --ok-soft: #173326; --warn: #F0B54A; --warn-soft: #3A2C10; --crit: #FF6B73; --crit-soft: #3D1A20;
  --bronze: #D8925A; --silver: #B5BDC8; --gold: #E9C048; --diamond: #6CC8EA; --black-medal: #E8E8E8;
  --path-1: #8EA6FF; --path-2: #C792EA; --path-3: #5FD3B6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.mono, code { font-family: var(--font-mono); font-size: .92em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: .5px; }
.brand p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.example { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.jump { display: none; text-decoration: none; color: var(--accent); }
@media (max-width: 900px) { .jump { display: inline-block; } }
.btn:hover { border-color: var(--accent); color: var(--accent); }

.grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* control rail */
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 14px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; min-width: 0; }
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lbl .hint { text-transform: none; letter-spacing: 0; font-weight: 500; }
.input, select.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.input:focus { border-color: var(--accent); }

.maplist { position: relative; border: 1px solid var(--line); border-radius: 8px; max-height: 190px; overflow: auto; background: var(--surface-2); }
.mapgroup { position: sticky; top: 0; background: var(--surface-2); padding: 5px 9px 3px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.mapbtn { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 5px 9px; cursor: pointer; border-radius: 0; }
.mapbtn:hover { background: var(--accent-soft); }
.mapbtn[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.mapbtn small { opacity: .75; font-size: 11px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.d-Beginner { background: #4FA65B; } .d-Intermediate { background: #D9A400; } .d-Advanced { background: #D46A1F; } .d-Expert { background: #C3263A; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tchip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.tchip i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.tchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tchip:disabled { opacity: .4; cursor: not-allowed; }
.c-Primary { background: #4A86E8; } .c-Military { background: #5B8A3A; } .c-Magic { background: #9B59D0; } .c-Support { background: #D9963A; }

.picks { display: grid; gap: 8px; }
.pick { border: 1px solid var(--line); border-radius: var(--r); padding: 9px; display: grid; gap: 8px; background: var(--surface-2); }
.pick-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pick-name { font-weight: 700; min-width: 0; }
.pick-name small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.xcode { font-family: var(--font-mono); font-weight: 700; font-size: 18px; letter-spacing: .5px; }
.x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--crit); background: var(--crit-soft); }
.steppers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stp { display: grid; gap: 3px; min-width: 0; }
.stp > span { font-size: 10.5px; color: var(--muted); font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp-ctl { display: grid; grid-template-columns: 22px minmax(0, 1fr) 22px; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); overflow: hidden; }
.stp-ctl button { border: 0; background: none; height: 26px; cursor: pointer; font-weight: 700; color: var(--muted); padding: 0; }
.stp-ctl button:hover { color: var(--accent); background: var(--accent-soft); }
.stp-ctl b { text-align: center; font-family: var(--font-mono); font-size: 14px; }
.stp.p0 b { color: var(--path-1); } .stp.p1 b { color: var(--path-2); } .stp.p2 b { color: var(--path-3); }
.pips { display: flex; gap: 2px; justify-content: center; }
.pips i { width: 5px; height: 5px; border-radius: 1px; background: var(--line); }
.stp.p0 .pips i.on { background: var(--path-1); } .stp.p1 .pips i.on { background: var(--path-2); } .stp.p2 .pips i.on { background: var(--path-3); }
.lvl { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.lvl-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.toggles { display: grid; gap: 7px; }
.subtle { color: var(--muted); font-size: 12px; }

/* results */
.results { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.card-h h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: .3px; }
.card-h .subtle { font-size: 12.5px; }

/* verdict */
.verdict { border-width: 2px; }
.vtop { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.vmap { font-family: var(--font-display); font-size: 26px; line-height: 1.05; }
.medal { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 3px 10px 3px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); }
.medal i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.m-easy { background: var(--bronze); } .m-medium { background: var(--silver); } .m-hard { background: var(--gold); } .m-imp { background: var(--diamond); } .m-chimps { background: var(--black-medal); outline: 2px solid var(--crit); outline-offset: -2px; } .m-none { background: var(--line); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.stat { display: grid; gap: 0; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.notes { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.notes li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 13.5px; }
.notes li::before { content: ""; width: 9px; height: 9px; border-radius: 2px; transform: translateY(1px); background: var(--ok); }
.notes li.warn::before { background: var(--warn); }
.notes li.crit::before { background: var(--crit); }
.notes li.crit { color: var(--crit); font-weight: 600; }
.notes li.info::before { background: var(--muted); }
.notes li.info { color: var(--muted); font-size: 12.5px; }
.ixev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 9px; min-width: 0; }
.ixev-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.ixrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ixrows li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13.5px; min-width: 0; }
.ixrows li .subtle { overflow-wrap: anywhere; }
.ixchip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.ixchip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.ixchip.no { color: var(--muted); font-weight: 700; min-width: 28px; text-align: center; }
.cov { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.covc { border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; border: 1px solid transparent; min-width: 0; }
.covc .cl { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-weight: 700; }
.covc .cl span { font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.covc .cb { font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; }
.s-covered { background: var(--ok-soft); color: var(--ok); }
.s-covered .cb { color: var(--ink); }
.s-partial, .s-late { background: var(--warn-soft); color: var(--warn); }
.s-partial .cb, .s-late .cb { color: var(--ink); }
.s-uncovered { background: var(--crit-soft); color: var(--crit); border-color: var(--crit); }
.s-uncovered .cb { font-weight: 700; }
.s-na { background: var(--surface-2); color: var(--muted); border-color: var(--line); }

/* map */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.fact span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.fact b { font-weight: 600; overflow-wrap: anywhere; }
.plan { background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 12px; max-width: 80ch; line-height: 1.55; overflow-wrap: anywhere; }
.plan-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.tlist { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tlist > em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 700; min-width: 54px; }
.tt { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.tt.hit-good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.tt.hit-bad { background: var(--crit-soft); border-color: var(--crit); color: var(--crit); font-weight: 700; }
.conf { font-weight: 700; }
.conf-high { color: var(--ok); } .conf-med { color: var(--warn); } .conf-low { color: var(--crit); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .two { grid-template-columns: minmax(0, 1fr); } }
.prose { max-width: 75ch; overflow-wrap: anywhere; }
.prose b { font-weight: 700; }

/* chart + tables */
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 480px; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .avail { fill: var(--cash-soft); stroke: var(--cash); stroke-width: 2; }
.chart .spent { fill: none; stroke: var(--accent); stroke-width: 2.25; }
.chart .buy { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.chart .danger { fill: var(--crit); }
.chart .danger-t { fill: var(--crit); font-weight: 700; font-size: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl-wrap.scroll { max-height: 340px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.flag td { background: var(--crit-soft); color: var(--crit); }
tr.hi td { background: var(--accent-soft); }
.rnd { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
.donechips { display: flex; flex-wrap: wrap; gap: 6px; }
.dchip { font-size: 12.5px; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.dchip.bad { border-color: var(--crit); color: var(--crit); background: var(--crit-soft); font-weight: 600; }

/* XP */
.xpline { font-size: 13.5px; }
.xpline b { font-variant-numeric: tabular-nums; }
.split { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.split span { height: 100%; }
.split-l { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.split-l i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.lvcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: var(--surface-2); min-width: 0; }
.lvtop { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.lvtop h3 { font-size: 16px; }
.big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.big small { font-size: 13px; color: var(--muted); font-weight: 500; }
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 5px; min-width: 0; }
.goal.target { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.goal .gl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.goal .gv { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal .gv small { font-size: 12px; font-weight: 500; color: var(--muted); }
.goal .gs { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.callout { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); max-width: 85ch; }
.callout.info { background: var(--accent-soft); }

/* guide */
.guide { display: grid; gap: 10px; }
.gtower { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.gtower h3 { font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gtower h3 .subtle { font-weight: 500; }
.gtower ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.xps { display: flex; flex-wrap: wrap; gap: 6px; }
.xp { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; max-width: 100%; }
.xp b { font-family: var(--font-mono); }
.xp.match { border-color: var(--accent); background: var(--accent-soft); }
.empty { color: var(--muted); font-style: italic; }
footer { color: var(--muted); font-size: 12px; max-width: 90ch; }

@media (max-width: 480px) {
  .brand h1 { font-size: 25px; }
  .vmap { font-size: 22px; }
  .card { padding: 12px; }
  .cov { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar span, .split span { transition: width .25s ease; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">

    }
    /* cumulative spend step line */
    var bought = build.rows.filter(function (r) { return r.round != null; });
    var d = 'M' + X(a).toFixed(1) + ',' + Y(0).toFixed(1), cum = 0, lastX = X(a);
    var byRound = {};
    bought.forEach(function (r) { byRound[r.round] = r.cum; });
    Object.keys(byRound).map(Number).sort(function (p, q) { return p - q; }).forEach(function (r) {
      d += ' L' + X(r).toFixed(1) + ',' + Y(cum).toFixed(1) + ' L' + X(r).toFixed(1) + ',' + Y(byRound[r]).toFixed(1);

        '</tbody></table></div><p class="subtle">"Buy by" is the last round a purchase still pays for itself by R' + range[1] + '. Costs are the Medium total times ×' + mode.costMult + ', so they can be a few dollars off the in-game price.' + (mode.cashMult !== 1 ? ' Income is halved in this mode.' : '') + '</p>';

        dps.map(function (d) { return '<tr class="' + (d.match ? 'hi' : '') + '"><td>' + esc(d.build) + (d.match ? ' <span class="tag">your build</span>' : '') + (d.caveat ? '<br><span class="subtle">' + esc(d.caveat) + '</span>' : '') + '</td><td class="n">' + L.money(d.cost) + '</td><td class="n">' + d.dpsVsCeramic + '</td><td class="n">' + d.dpsVsMoab + '</td><td class="n"><b>' + d.dpsPerK + '</b></td></tr>'; }).join('') +

    var i = S.picks.findIndex(function (p) { return p.id === id; });
    if (i >= 0) S.picks.splice(i, 1);
    else S.picks.push({ id: id, cross: [0, 0, 0], count: 1, level: false, banked: 0, target: 'next' });
    changed({ controls: true });
  });
  $('picks').addEventListener('click', function (e) {
    var rm = e.target.closest('[data-remove]');
    if (rm) { S.picks.splice(+rm.getAttribute('data-remove'), 1); changed({ controls: true }); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var p = S.picks[+b.getAttribute('data-i')]; if (!p) return;
    var d = +b.getAttribute('data-d'), act = b.getAttribute('data-act');
    if (act === 'count') p.count = Math.max(1, Math.min(20, p.count + d));
    else { var k = +act.slice(4); p.cross = L.setPath(p.cross, k, p.cross[k] + d); }
    changed({ controls: true });
    var again = document.querySelector('#picks [data-act="' + act + '"][data-i="' + b.getAttribute('data-i') + '"][data-d="' + d + '"]');
    if (again) again.focus();
  });
  $('picks').addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-level')) { var p = S.picks[+t.getAttribute('data-level')]; if (p) { p.level = t.checked; if (p.level && !L.towerById(D, p.id).paragon && p.target === 'paragon') p.target = 'next'; } changed({ controls: true }); }
    else if (t.hasAttribute('data-tgt')) { var q = S.picks[+t.getAttribute('data-tgt')]; if (q) q.target = t.value; changed(); }
  });
  $('picks').addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-bank')) { var p = S.picks[+t.getAttribute('data-bank')]; if (p) p.banked = Math.max(0, +t.value || 0); changed(); }
  });
  $('resetBtn').addEventListener('click', function () { S = clone(EXAMPLE); $('mapSearch').value = ''; renderAll(); scrollMapIntoView(); });

  renderAll();
  scrollMapIntoView();
})();
</script>
