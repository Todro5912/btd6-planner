<title>Planner · Monkey Intel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Luckiest+Guy&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Planner skin. Scoped to .planner and built on the site tokens (assets/site.css); every token has a
   fallback so src/btd6-planner.html still renders on its own. Layout: control rail left, results right. */
.planner {
  --pl-bg: var(--paper, #FFF8E7);
  --pl-panel: var(--panel, #FFFFFF);
  --pl-tint: var(--paper-2, #FBF0D4);
  --pl-text: var(--text, #1C1A17);
  --pl-ink: var(--ink, #1C1A17);
  --pl-muted: var(--muted, #6B5E4E);
  --pl-wood: var(--wood, #8A5A2B);
  --pl-cream: var(--cream, #FFF8E7);
  --pl-banana: var(--banana, #FFD23F);
  --pl-grass: var(--grass, #3E9B2F);
  --pl-r: var(--r, 6px);
  --pl-display: var(--font-display, "Luckiest Guy", "Arial Black", Impact, sans-serif);
  --pl-mono: var(--font-mono, "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace);
  /* names the planner script uses in inline styles and SVG */
  --accent: var(--link, #0E6198);
  --ok: #2E8B3A; --ok-soft: #DDF0DA;
  --warn: #A55E00; --warn-soft: #FFF0C2;
  --crit: var(--danger, #E2412E); --crit-soft: var(--danger-soft, #FCE3DE);
  --cash: #B57F00; --cash-soft: rgba(255, 210, 63, .38);
  --bronze: #C77B3A; --silver: #8E9AA5; --gold: #F2B632; --diamond: #3FA9E6; --black-medal: #1C1A17;
  --path-1: var(--link, #0E6198); --path-2: var(--wood, #8A5A2B); --path-3: var(--grass, #3E9B2F);
  color: var(--pl-text);
  font-family: var(--font-body, "Rubik", system-ui, sans-serif);
  font-size: 14.5px; line-height: 1.45;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .planner {
    --ok: #5CC46B; --ok-soft: #173326; --warn: #FFC861; --warn-soft: #3A2C10; --cash: #FFDA55; --cash-soft: rgba(255, 218, 85, .18);
    --silver: #B5BDC8; --black-medal: #05090D;
  }
}
:root[data-theme="dark"] .planner {
  --ok: #5CC46B; --ok-soft: #173326; --warn: #FFC861; --warn-soft: #3A2C10; --cash: #FFDA55; --cash-soft: rgba(255, 218, 85, .18);
  --silver: #B5BDC8; --black-medal: #05090D;
}
.planner *, .planner *::before, .planner *::after { box-sizing: border-box; }
.planner h1, .planner h2, .planner h3 { margin: 0; text-wrap: balance; }
.planner p { margin: 0; }
.planner .num, .planner td.n { font-variant-numeric: tabular-nums; }
.planner .mono, .planner code { font-family: var(--pl-mono); font-size: .92em; }
.planner button, .planner input, .planner select { font: inherit; color: inherit; }
.planner :focus-visible { outline: 3px solid var(--focus, #0E6198); outline-offset: 2px; }
.planner .subtle { color: var(--pl-muted); font-size: 13px; }

.pl-wrap { display: grid; gap: 16px; }
.pl-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.pl-top .pl-sub { color: var(--pl-muted); font-size: 14px; margin-top: 4px; }
.planner .example { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.planner .jump { display: none; }
@media (max-width: 900px) { .planner .jump { display: inline-flex; } }
/* standalone fallbacks for the shared components */
.planner .btn:not([class*="btn-"]) { cursor: pointer; font-weight: 700; border: 3px solid var(--pl-ink); border-radius: var(--pl-r); background: var(--pl-panel); padding: 6px 12px; box-shadow: 0 4px 0 var(--pl-ink); color: var(--pl-text); text-decoration: none; }
.planner .btn:disabled { opacity: .55; cursor: default; box-shadow: 0 2px 0 var(--pl-ink); transform: translateY(2px); }
.planner .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 1px 8px; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); background: var(--pl-panel); color: var(--pl-text); }
.planner #exampleTag { background: var(--pl-banana); color: var(--pl-ink); }

.planner .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .planner .grid { grid-template-columns: minmax(0, 1fr); } }

/* control rail */
.planner .rail { background: var(--pl-panel); border: 3px solid var(--pl-ink); border-radius: var(--pl-r); box-shadow: 0 4px 0 var(--pl-ink); padding: 14px; display: grid; gap: 14px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; min-width: 0; }
@media (max-width: 900px) { .planner .rail { position: static; max-height: none; } }
.planner .field { display: grid; gap: 6px; min-width: 0; }
.planner .field > label, .planner .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pl-muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.planner .lbl .hint, .planner .field > label .hint { text-transform: none; letter-spacing: 0; font-weight: 500; }
.planner .input { width: 100%; border: 2px solid var(--pl-ink); background: var(--pl-bg); border-radius: var(--pl-r); padding: 6px 9px; min-width: 0; color: var(--pl-text); }

.planner .maplist { border: 2px solid var(--pl-ink); border-radius: var(--pl-r); max-height: 200px; overflow: auto; background: var(--pl-bg); }
.planner .mapgroup { position: sticky; top: 0; background: var(--pl-wood); color: var(--pl-cream); padding: 4px 9px 3px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; border-bottom: 2px solid var(--pl-ink); }
.planner .mapbtn { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 4px 9px; cursor: pointer; }
.planner .mapbtn:hover { background: var(--pl-tint); }
.planner .mapbtn[aria-selected="true"] { background: var(--pl-banana); color: var(--pl-ink); font-weight: 700; }
.planner .mapbtn small { opacity: .8; font-size: 11.5px; }
.planner .dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; flex: none; border: 2px solid var(--pl-ink); margin: 0; }
.planner .d-Beginner { background: var(--tier-beginner, #3E9B2F); } .planner .d-Intermediate { background: var(--tier-intermediate, #FFD23F); }
.planner .d-Advanced { background: var(--tier-advanced, #E8892B); } .planner .d-Expert { background: var(--tier-expert, #E2412E); }

.planner .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.planner .tchip { border: 2px solid var(--pl-ink); background: var(--pl-panel); border-radius: var(--pl-r); padding: 2px 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 0 var(--pl-ink); transition: transform 80ms, box-shadow 80ms; }
.planner .tchip:active { transform: translateY(2px); box-shadow: 0 0 0 var(--pl-ink); }
.planner .tchip i { width: 8px; height: 8px; border: 1.5px solid var(--pl-ink); display: inline-block; }
.planner .tchip[aria-pressed="true"] { background: var(--pl-banana); color: var(--pl-ink); font-weight: 700; }
.planner .tchip:disabled { opacity: .4; cursor: not-allowed; }
.planner .c-Primary { background: var(--cls-primary, #3FA9E6); } .planner .c-Military { background: var(--cls-military, #5E8C31); }
.planner .c-Magic { background: var(--cls-magic, #8E4FC2); } .planner .c-Support { background: var(--cls-support, #E8892B); }

.planner .picks { display: grid; gap: 8px; }
.planner .pick { border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 9px; display: grid; gap: 8px; background: var(--pl-tint); }
.planner .pick-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.planner .pick-name { font-weight: 700; min-width: 0; }
.planner .pick-name small { display: block; font-weight: 500; color: var(--pl-muted); font-size: 12px; }
.planner .xcode { font-family: var(--pl-mono); font-weight: 700; font-size: 17px; }
.planner .x { border: 2px solid transparent; background: none; cursor: pointer; color: var(--pl-muted); font-size: 18px; line-height: 1; padding: 1px 6px; border-radius: var(--pl-r); }
.planner .x:hover { color: var(--crit); border-color: var(--pl-ink); background: var(--crit-soft); }
.planner .steppers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.planner .stp { display: grid; gap: 3px; min-width: 0; }
.planner .stp > span { font-size: 10.5px; color: var(--pl-muted); font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.planner .stp-ctl { display: grid; grid-template-columns: 22px minmax(0, 1fr) 22px; align-items: center; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); background: var(--pl-panel); overflow: hidden; }
.planner .stp-ctl button { border: 0; background: none; height: 26px; cursor: pointer; font-weight: 700; color: var(--pl-text); padding: 0; }
.planner .stp-ctl button:hover { background: var(--pl-banana); color: var(--pl-ink); }
.planner .stp-ctl b { text-align: center; font-family: var(--pl-mono); font-size: 14px; }
.planner .stp.p0 b { color: var(--path-1); } .planner .stp.p1 b { color: var(--path-2); } .planner .stp.p2 b { color: var(--path-3); }
.planner .pips { display: flex; gap: 2px; justify-content: center; }
.planner .pips i { width: 6px; height: 6px; border: 1.5px solid var(--pl-ink); background: var(--pl-panel); }
.planner .stp .pips i.on { background: var(--pl-wood); }
.planner .lvl { display: grid; gap: 6px; border-top: 2px dashed var(--pl-ink); padding-top: 8px; }
.planner .lvl-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.planner .check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13.5px; font-weight: 500; }
.planner .check input { accent-color: var(--pl-grass); width: 16px; height: 16px; margin: 0; }
.planner .toggles { display: grid; gap: 7px; }

/* results */
.planner .results { display: grid; gap: 18px; min-width: 0; }
.planner .card { background: var(--pl-panel); border: 3px solid var(--pl-ink); border-radius: var(--pl-r); box-shadow: 0 4px 0 var(--pl-ink); padding: 0 14px 14px; display: grid; gap: 12px; min-width: 0; }
.planner .card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; background: var(--pl-wood); color: var(--pl-cream); margin: 0 -14px; padding: 8px 14px 6px; border-bottom: 3px solid var(--pl-ink); border-radius: 3px 3px 0 0; }
.planner .card-h h2 { font-family: var(--pl-display); font-weight: 400; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; -webkit-text-stroke: 3px var(--pl-ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--pl-ink); }
.planner .card-h .subtle, .planner .card-h span { color: #F3E3C4 !important; font-size: 13px; }
.planner .card-h .conf { -webkit-text-stroke: 0; }

/* verdict */
.planner .verdict { border-color: var(--pl-ink) !important; }
.planner .verdict .card-h > span:last-child { background: var(--pl-panel); color: var(--pl-text) !important; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 0 8px; font-weight: 700; font-size: 14px; }
.planner .vtop { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.planner .vmap { font-family: var(--pl-display); font-size: 28px; line-height: 1.05; text-transform: uppercase; }
.planner .medal { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 1px 8px 1px 3px; border-radius: var(--pl-r); border: 2px solid var(--pl-ink); background: var(--pl-panel); }
.planner .medal i { width: 16px; height: 16px; border-radius: 999px; display: inline-block; border: 2px solid var(--pl-ink); }
.planner .m-easy { background: var(--bronze); } .planner .m-medium { background: var(--silver); } .planner .m-hard { background: var(--gold); } .planner .m-imp { background: var(--diamond); }
.planner .m-chimps { background: var(--black-medal); box-shadow: inset 0 0 0 2px var(--gold); } .planner .m-none { background: var(--pl-tint); }
.planner .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.planner .stat { display: grid; gap: 0; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); background: var(--pl-tint); padding: 4px 10px; box-shadow: none; }
.planner .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.planner .stat span { font-size: 11px; color: var(--pl-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.planner .notes { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.planner .notes li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; }
.planner .notes li::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--pl-ink); background: var(--ok); transform: translateY(1px); }
.planner .notes li.warn::before { background: var(--pl-banana); }
.planner .notes li.crit::before { background: var(--crit); }
.planner .notes li.crit { color: var(--crit); font-weight: 700; }
.planner .notes li.info::before { background: var(--pl-panel); }
.planner .notes li.info { color: var(--pl-muted); font-size: 13px; }
.planner .ixev { border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 10px 12px; display: grid; gap: 9px; min-width: 0; background: var(--pl-bg); }
.planner .ixev-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.planner .ixrows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.planner .ixrows li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; min-width: 0; }
.planner .ixrows li .subtle { overflow-wrap: anywhere; }
.planner .ixchip { font-size: 12px; padding: 0 7px; border-radius: var(--pl-r); border: 2px solid var(--pl-ink); background: var(--pl-panel); white-space: nowrap; font-weight: 700; }
.planner .ixchip.ok { background: var(--pl-grass); color: #fff; }
.planner .ixchip.no { color: var(--pl-muted); min-width: 28px; text-align: center; }
.planner .cov { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.planner .covc { border-radius: var(--pl-r); padding: 7px 10px; display: grid; gap: 2px; border: 2px solid var(--pl-ink); min-width: 0; background: var(--pl-panel); }
.planner .covc .cl::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--pl-ink); border-radius: 999px; background: var(--ok); flex: none; margin-right: -2px; align-self: center; }
.planner .covc .cl { display: flex; align-items: baseline; gap: 6px; font-weight: 700; }
.planner .covc .cl span { margin-left: auto; }
.planner .covc .cl span { font-family: var(--pl-mono); font-size: 12px; font-weight: 700; }
.planner .covc .cb { font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; color: var(--pl-text); }
.planner .s-covered { color: var(--pl-text); }
.planner .s-partial, .planner .s-late { background: var(--warn-soft); }
.planner .s-partial .cl::before, .planner .s-late .cl::before { background: var(--pl-banana); }
.planner .s-uncovered { background: var(--crit-soft); color: var(--crit); }
.planner .s-uncovered .cl::before { background: var(--crit); }
.planner .s-uncovered .cb { font-weight: 700; color: var(--crit); }
.planner .s-na { background: var(--pl-tint); color: var(--pl-muted); }
.planner .s-na .cl::before { background: var(--pl-panel); }
.planner .s-na .cb { color: var(--pl-muted); }

/* map card */
.planner .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.planner .fact { background: var(--pl-tint); border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 5px 9px; min-width: 0; }
.planner .fact span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--pl-muted); font-weight: 700; }
.planner .fact b { font-weight: 700; overflow-wrap: anywhere; }
.planner .plan { background: var(--pl-bg); border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 10px 12px; max-width: 80ch; line-height: 1.55; overflow-wrap: anywhere; }
.planner .plan-h { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--pl-wood); margin-bottom: 4px; }
.planner .tlist { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.planner .tlist > em { font-style: normal; font-size: 12px; color: var(--pl-muted); font-weight: 700; min-width: 54px; text-transform: uppercase; letter-spacing: .04em; }
.planner .tt { font-size: 13px; padding: 0 7px; border-radius: var(--pl-r); background: var(--pl-panel); border: 2px solid var(--pl-ink); box-shadow: none; font-weight: 500; }
.planner .tt.hit-good { background: var(--pl-grass); color: #fff; font-weight: 700; }
.planner .tt.hit-bad { background: var(--crit); color: #fff; font-weight: 700; }
.planner .conf { font-weight: 700; text-transform: uppercase; }
.planner .conf-high { color: var(--ok); } .planner .conf-med { color: var(--pl-banana); } .planner .conf-low { color: #FFB4A8; }
.planner .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .planner .two { grid-template-columns: minmax(0, 1fr); } }
.planner .prose { max-width: 75ch; overflow-wrap: anywhere; }

/* chart + tables */
.planner .chart-wrap { overflow-x: auto; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); background: var(--pl-bg); }
.planner .chart { width: 100%; min-width: 480px; height: auto; display: block; }
.planner .chart text { fill: var(--pl-muted); font-family: inherit; font-size: 11px; }
.planner .chart .grid-l { stroke: var(--pl-tint); stroke-width: 1.5; }
.planner .chart .avail { fill: var(--cash-soft); stroke: var(--cash); stroke-width: 2.5; }
.planner .chart .spent { fill: none; stroke: var(--pl-ink); stroke-width: 2.5; }
.planner .chart .buy { fill: var(--pl-banana); stroke: var(--pl-ink); stroke-width: 2; }
.planner .chart .danger { fill: var(--crit); }
.planner .chart .danger-t { fill: var(--crit); font-weight: 700; font-size: 10px; }
.planner .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--pl-muted); }
.planner .legend i { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: 5px; }
.planner .tbl-wrap { overflow-x: auto; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); }
.planner .tbl-wrap.scroll { max-height: 340px; overflow-y: auto; }
.planner table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.planner th, .planner td { padding: 5px 10px; text-align: left; vertical-align: top; }
.planner th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--pl-cream); background: var(--pl-wood); position: sticky; top: 0; z-index: 1; white-space: nowrap; border-bottom: 2px solid var(--pl-ink); }
.planner tbody tr:nth-child(even) td { background: var(--pl-tint); }
.planner td.n, .planner th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.planner tr.flag td { background: var(--crit-soft) !important; color: var(--crit); }
.planner tr.hi td { background: var(--pl-banana) !important; color: var(--pl-ink); }
.planner .rnd { font-family: var(--pl-mono); font-weight: 700; white-space: nowrap; }
.planner .donechips { display: flex; flex-wrap: wrap; gap: 6px; }
.planner .dchip { font-size: 12.5px; padding: 2px 8px; border-radius: var(--pl-r); background: var(--pl-panel); border: 2px solid var(--pl-ink); }
.planner .dchip.bad { color: var(--crit); background: var(--crit-soft); font-weight: 700; }

/* XP */
.planner .xpline { font-size: 14px; }
.planner .xpline b { font-variant-numeric: tabular-nums; }
.planner .split { display: flex; height: 16px; border: 2px solid var(--pl-ink); border-radius: var(--pl-r); overflow: hidden; background: var(--pl-tint); }
.planner .split span { height: 100%; }
.planner .split span + span { border-left: 2px solid var(--pl-ink); }
.planner .split-l { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.planner .split-l i { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--pl-ink); margin-right: 5px; }
.planner .lvcard { border: 2px solid var(--pl-ink); border-radius: var(--pl-r); padding: 12px; display: grid; gap: 10px; background: var(--pl-bg); min-width: 0; }
.planner .lvtop { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.planner .lvtop h3 { font-size: 16px; }
.planner .big { font-family: var(--pl-display); font-weight: 400; font-size: 30px; line-height: 1; color: #fff; -webkit-text-stroke: 3px var(--pl-ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--pl-ink); font-variant-numeric: tabular-nums; }
.planner .big small { font-family: var(--font-body, sans-serif); font-size: 13px; color: var(--pl-muted); -webkit-text-stroke: 0; text-shadow: none; }
.planner .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }

<script>
(function () {

  function medalClass(mode) {

  function sanitize(s) {

    if (Array.isArray(s.picks)) {
      var seen = {};
      o.picks = s.picks.filter(function (p) { return p && L.towerById(D, p.id) && !seen[p.id] && (seen[p.id] = true); }).map(function (p) {
        var c = Array.isArray(p.cross) ? p.cross.map(function (x) { return Math.max(0, Math.min(5, Math.round(+x || 0))); }) : [0, 0, 0];
        while (c.length < 3) c.push(0);

  }
  var S;
  try { var raw = localStorage.getItem(KEY); S = sanitize(raw ? JSON.parse(raw) : null); } catch (e) { S = clone(EXAMPLE); }

  /* Hash prefill from the hub pages: #map=<id>, #mode=<id>, #tower=<id>, #hero=<id> (combine with &).

  function towerPreset(id) {
    var t = L.towerById(D, id); if (!t) return null;

    var cross = [0, 0, 0];
    for (var i = 0; i < codes.length; i++) { var c = L.parseCode(codes[i]); if (c && L.validCross(c)) { cross = c; break; } }

    var html = S.picks.map(function (p, i) {

      var pathNames = [0, 1, 2].map(function (k) { var u = L.upgrade(t, k, Math.max(1, p.cross[k])); return p.cross[k] > 0 && u ? u.name : ['Top', 'Middle', 'Bottom'][k] + ' path'; });
      var lv = '';
      if (p.level) {

          '<div class="field"><label for="tgt' + i + '">Target</label><select class="input" id="tgt' + i + '" data-tgt="' + i + '"><option value="next"' + (p.target === 'next' ? ' selected' : '') + '>Next tier</option><option value="t5"' + (p.target === 't5' ? ' selected' : '') + '>All T5s</option>' + (t.paragon ? '<option value="paragon"' + (p.target === 'paragon' ? ' selected' : '') + '>Paragon</option>' : '') + '</select></div></div>';

  /* ---------- results ---------- */
  function niceStep(max, n) {
    var raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;

  }
  function kfmt(v) { return v >= 1000 ? '$' + (v / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k' : '$' + Math.round(v); }

  function chartSvg(build, mode, rounds) {
    var a = build.start, b = build.end;
    var W = 720, H = 250, ml = 50, mr = 14, mt = 14, mb = 34;
    var curve = build.curve.filter(function (c) { return c.round >= a && c.round <= b; });
    var ymaxRaw = Math.max(build.endAvail, build.totalWanted, 1);
    var step = niceStep(ymaxRaw, 4), ymax = Math.ceil(ymaxRaw * 1.04 / step) * step;
    var span = Math.max(1, b - a);
    function X(r) { return ml + (r - a) / span * (W - ml - mr); }
    function Y(v) { return mt + (1 - v / ymax) * (H - mt - mb); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cash available and cumulative spend by round">';
    for (var v = 0; v <= ymax + 1e-6; v += step) {
      s += '<line class="grid-l" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"></line>';
      s += '<text x="' + (ml - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + kfmt(v) + '</text>';
    }
    var xs = niceStep(span, 7); if (xs < 1) xs = 1;
    var firstTick = Math.ceil(a / xs) * xs;
    var ticks = [a]; for (var t = firstTick; t <= b; t += xs) if (t - a >= xs * 0.5 && b - t >= xs * 0.3) ticks.push(t); ticks.push(b);
    ticks.forEach(function (r) { s += '<text x="' + X(r).toFixed(1) + '" y="' + (H - mb + 15) + '" text-anchor="middle">R' + r + '</text>'; });
    /* available-cash area */
    if (curve.length) {
      var pts = curve.map(function (c) { return X(c.round).toFixed(1) + ',' + Y(c.avail).toFixed(1); });
      s += '<path class="avail" d="M' + X(curve[0].round).toFixed(1) + ',' + Y(0).toFixed(1) + ' L' + pts.join(' L') + ' L' + X(curve[curve.length - 1].round).toFixed(1) + ',' + Y(0).toFixed(1) + ' Z" stroke-linejoin="round"></path>';
    }
    /* cumulative spend step line */
    var bought = build.rows.filter(function (r) { return r.round != null; });
    var d = 'M' + X(a).toFixed(1) + ',' + Y(0).toFixed(1), cum = 0, lastX = X(a);
    var byRound = {};
    bought.forEach(function (r) { byRound[r.round] = r.cum; });
    Object.keys(byRound).map(Number).sort(function (p, q) { return p - q; }).forEach(function (r) {
      d += ' L' + X(r).toFixed(1) + ',' + Y(cum).toFixed(1) + ' L' + X(r).toFixed(1) + ',' + Y(byRound[r]).toFixed(1);
      cum = byRound[r]; lastX = X(r);
    });
    d += ' L' + X(b).toFixed(1) + ',' + Y(cum).toFixed(1);
    s += '<path class="spent" d="' + d + '"></path>';
    Object.keys(byRound).forEach(function (r) {
      var items = bought.filter(function (x) { return x.round === +r; });
      s += '<circle class="buy" cx="' + X(+r).toFixed(1) + '" cy="' + Y(byRound[r]).toFixed(1) + '" r="4.5"><title>R' + r + ': ' + esc(items.map(function (x) { return x.towerName + (x.kind === 'hero' ? '' : ' → ' + x.code); }).join(', ')) + ' · total ' + L.money(byRound[r]) + '</title></circle>';
    });
    /* danger markers */
    var lastLabel = -1e9;
    rounds.filter(function (r) { return r.round >= a && r.round <= b && r.danger >= 3; }).forEach(function (r) {
      var x = X(r.round);
      s += '<path class="danger" d="M' + (x - 4).toFixed(1) + ',' + (H - mb + 0) + ' L' + (x + 4).toFixed(1) + ',' + (H - mb) + ' L' + x.toFixed(1) + ',' + (H - mb - 7) + ' Z"><title>R' + r.round + ' danger: ' + esc((r.threats || []).join(', ')) + (r.notes ? ' · ' + esc(r.notes) : '') + '</title></path>';
      if (x - lastLabel > 26) { s += '<text class="danger-t" x="' + x.toFixed(1) + '" y="' + (H - 2) + '" text-anchor="middle">' + r.round + '</text>'; lastLabel = x; }
    });
    s += '</svg>';
    return s;
  }

  /* Index evidence block for the map card (btd6index.win, v57.4 data). */
  function indexBlock(ev, mode) {
    if (!ev) return '';
    var yn = function (b) { return b == null ? '?' : b ? 'yes' : 'no'; };
    var lanes = ev.lanes.length ? ev.lanes.map(function (l) { return (ev.lanes.length > 1 ? l.lane + ' ' : '') + l.rbs; }).join(' · ') : (ev.laneNotes || 'not measured');
    var listTxt = !ev.twoMP ? 'no data' : ev.twoMP.count + ' solo-CHIMPS wins' + (ev.listState === 'complete' ? ' (full list)' : ev.listState === 'partial' ? ' (first ' + ev.twoMP.shown + ' names)' : ' (names not captured)');
    var h = '<div class="ixev" aria-label="Index evidence"><div class="ixev-h"><span class="lbl">Index evidence</span><span class="subtle">btd6index.win, v57.4 data, fetched 2026-11-05</span></div>';
    h += '<div class="facts">' +
      '<div class="fact" style="grid-column:span 2"><span>Lane RBS</span><b class="mono">' + esc(lanes) + '</b></div>' +
      '<div class="fact"><span>Entrances / exits</span><b>' + esc(ev.entrances == null ? '?' : ev.entrances) + ' / ' + esc(ev.exits == null ? '?' : ev.exits) + '</b></div>' +
      '<div class="fact"><span>Water (Index)</span><b>' + yn(ev.water) + '</b></div>' +
      '<div class="fact"><span>LoS (Index)</span><b>' + yn(ev.los) + '</b></div>' +
      '<div class="fact"><span>Removal cost</span><b>' + esc(ev.removalCost || 'none') + '</b></div>' +
      '<div class="fact"><span>LCC record</span><b>' + (ev.lcc ? L.money(ev.lcc.money) + ' · v' + esc(ev.lcc.version) : '—') + '</b></div>' +
      '<div class="fact"><span>2MP list</span><b>' + esc(listTxt) + '</b></div>' +
      '</div>';
    var rows = ev.towers.slice();
    if (ev.hero) rows.push(ev.hero);
    if (rows.length) {
      h += '<ul class="ixrows">' + rows.map(function (r) {
        var chip = r.proven ? '<span class="ixchip ok">✓ solo-CHIMPS proven on this map</span>' : '<span class="ixchip no" title="No 2MP entry found">—</span>';
        var detail = r.proven ? esc(r.entities.slice(0, 4).join(', ') + (r.entities.length > 4 ? ' +' + (r.entities.length - 4) + ' more' : ''))
          : (r.listState === 'complete' ? 'no single-tower CHIMPS with it here' + (r.kind === 'tower' ? ' (support towers rarely solo)' : '') : r.listState === 'partial' ? 'not in the names captured (list incomplete)' : 'list not captured for this map');
        return '<li><b>' + esc(r.name) + '</b>' + chip + '<span class="subtle">' + detail + '</span></li>';
      }).join('') + '</ul>';
    } else h += '<p class="subtle">Pick towers to see whether each has soloed CHIMPS here.</p>';
    if (ev.flags.length) h += '<ul class="notes">' + ev.flags.map(function (x) { return '<li class="' + x.level + '">' + esc(x.text) + '</li>'; }).join('') + '</ul>';
    if (ev.conflicts.length) h += '<p class="subtle">Conflict kept in the data: ' + esc(ev.conflicts.map(function (c) { return c.field + ': Index ' + (c.index === true ? 'yes' : c.index === false ? 'no' : c.index) + ' vs ' + c.other + ' (kept ' + c.kept + ')'; }).join(' | ')) + '</p>';
    return h + '</div>';
  }

  function renderResults() {
    var map = mapById(S.mapId), mode = modeById(S.modeId);
    if (!map || !mode) { $('results').innerHTML = '<div class="card"><p class="empty">Pick a map and a mode.</p></div>'; return; }
    var rounds = L.roundSetFor(D, mode);
    var build = L.buildOrder(D, S.picks, S.heroId, mode, S.playstyle);
    var cov = L.coverage(D, S.picks, mode, build.ready);
    var legal = L.legality(D, S.picks, mode, map, S.heroId);
    var xp = L.xpProjection(D, mode, map, build, { me: S.me, emt: S.emt, freeplayTo: S.freeplayTo });
    var range = L.modeRange(mode);
    var hero = L.heroById(D, S.heroId);
    var html = '';

    /* A. verdict */
    var crit = legal.filter(function (x) { return x.level === 'crit'; }).length + cov.filter(function (c) { return c.status === 'uncovered'; }).length;
    var warn = legal.filter(function (x) { return x.level === 'warn'; }).length + cov.filter(function (c) { return c.status === 'partial' || c.status === 'late'; }).length;
    var verdictWord = crit ? crit + ' blocker' + (crit > 1 ? 's' : '') : warn ? 'Playable, ' + warn + ' to watch' : 'Good to go';
    var verdictColor = crit ? 'var(--crit)' : warn ? 'var(--warn)' : 'var(--ok)';
    html += '<section class="card verdict" style="border-color:' + verdictColor + '" aria-labelledby="hA">';
    html += '<div class="card-h"><h2 id="hA">Verdict</h2><span style="color:' + verdictColor + ';font-weight:700">' + verdictWord + '</span></div>';
    html += '<div class="vtop"><div class="vmap">' + esc(map.name) + '</div><span class="medal"><i class="' + medalClass(mode) + '"></i>' + esc(mode.name) + '</span><span class="tag"><span class="dot d-' + esc(map.difficulty) + '"></span>' + esc(map.difficulty) + ' ×' + (L.TIER_XP_MULT[map.difficulty] || 1).toFixed(1) + ' XP</span></div>';
    html += '<div class="stats">' +
      '<div class="stat"><b class="mono">R' + range[0] + '–' + range[1] + '</b><span>Rounds</span></div>' +
      '<div class="stat"><b>' + L.money(mode.startCash) + '</b><span>Start cash</span></div>' +
      '<div class="stat"><b>' + L.money(build.endAvail) + '</b><span>' + (mode.rules && mode.rules.noIncome ? 'All the cash you get' : 'Cash by R' + range[1] + ' (no income towers)') + '</span></div>' +
      '<div class="stat"><b style="color:' + (build.totalWanted > build.endAvail ? 'var(--crit)' : 'inherit') + '">' + L.money(build.totalWanted) + '</b><span>Build cost</span></div>' +
      '<div class="stat"><b>×' + mode.costMult + '</b><span>Prices</span></div>' +
      '</div>';
    html += '<ul class="notes">' + legal.map(function (x) { return '<li class="' + x.level + '">' + esc(x.text) + '</li>'; }).join('') + '</ul>';
    html += '<div class="cov">' + cov.map(function (c) {
      var tag = c.firstRound != null ? 'R' + c.firstRound : '—';
      var body;
      if (c.status === 'na') body = 'Not in R' + range[0] + '–' + range[1];
      else if (c.status === 'uncovered') body = 'uncovered!';
      else body = esc(c.by) + (c.note ? '<br><span style="color:inherit">' + esc(c.note) + '</span>' : '');
      return '<div class="covc s-' + c.status + '" title="' + esc(c.needNote) + '"><div class="cl">' + esc(c.label) + '<span>' + tag + '</span></div><div class="cb">' + body + '</div></div>';
    }).join('') + '</div>';
    html += '<p class="subtle">Each chip shows the first round in ' + (mode.roundSet === 'abr' ? 'the ABR round set' : 'the standard round set') + ' (R' + range[0] + '–' + range[1] + ') that needs the property, and the tower that answers it from its innate attack or its chosen upgrades.' + (hero ? ' ' + esc(hero.name) + ' is not counted: camo ' + esc(hero.camo || '?') + '; lead ' + esc(hero.lead || '?') + '.' : '') + '</p>';
    html += '</section>';

    /* B. map card */
    var mp = L.mapPlan(D, map.id, mode);
    var chosenIds = S.picks.map(function (p) { return p.id; });
    var tname = function (id) { var t = L.towerById(D, id); return t ? t.name : id; };
    html += '<section class="card" aria-labelledby="hB"><div class="card-h"><h2 id="hB">' + esc(map.name) + '</h2><span class="subtle">' + (mp ? 'Strategy confidence <span class="conf conf-' + esc(mp.s.confidence) + '">' + esc(mp.s.confidence || '?') + '</span>' : 'No strategy notes') + '</span></div>';
    var removables = (map.removables || []).map(function (r) { return r.name + (r.cost ? ' ' + L.money(L.price(r.cost, mode.costMult)) : '') + (r.count ? ' ×' + r.count : ''); }).join(', ');
    html += '<div class="facts">' +
      '<div class="fact"><span>Tier</span><b>' + esc(map.difficulty) + '</b></div>' +
      '<div class="fact"><span>Water</span><b>' + esc(map.water) + '</b></div>' +
      '<div class="fact"><span>LoS blockers</span><b>' + esc(map.losBlockers) + ((map.unverified || []).indexOf('losBlockers') >= 0 ? ' (unverified)' : '') + '</b></div>' +
      '<div class="fact"><span>Lanes</span><b>' + esc(map.paths) + '</b></div>' +
      '<div class="fact"><span>Track</span><b>' + esc(map.trackClass || '') + (map.trackLength ? ' · ' + map.trackLength : '') + '</b></div>' +
      '<div class="fact"><span>CHIMPS friendly</span><b>' + (map.chimpsFriendly ? 'yes' : 'no') + '</b></div>' +
      (removables ? '<div class="fact" style="grid-column:span 2"><span>Removables</span><b>' + esc(removables) + '</b></div>' : '') +
      '</div>';
    if (map.special || map.notes) html += '<p class="prose">' + esc([map.special, map.notes].filter(Boolean).join(' ')) + '</p>';
    html += indexBlock(L.indexEvidence(D, map, S.picks, S.heroId), mode);
    if (mp) {
      var tierName = { easy: 'Easy / Medium plan', hard: 'Hard / Impoppable plan', chimps: 'CHIMPS plan' }[mp.tier];
      html += '<div class="plan"><div class="plan-h">' + tierName + '</div>' + esc(mp.plan || 'No plan written for this tier.') + '</div>';
      html += '<div class="tlist"><em>Strong</em>' + (mp.s.strongTowers || []).map(function (id) { return '<span class="tt' + (chosenIds.indexOf(id) >= 0 ? ' hit-good' : '') + '">' + esc(tname(id)) + '</span>'; }).join('') + '</div>';
      html += '<div class="tlist"><em>Avoid</em>' + ((mp.s.avoidTowers || []).length ? mp.s.avoidTowers.map(function (id) { return '<span class="tt' + (chosenIds.indexOf(id) >= 0 ? ' hit-bad' : '') + '">' + esc(tname(id)) + '</span>'; }).join('') : '<span class="subtle">nothing listed</span>') + '</div>';
      html += '<div class="tlist"><em>Heroes</em>' + (mp.s.heroes || []).map(function (h) { return '<span class="tt' + (hero && hero.name === h ? ' hit-good' : '') + '">' + esc(h) + '</span>'; }).join('') + '</div>';
      var extra = [];
      if (mp.s.placement) extra.push('<div><div class="lbl">Placement</div><p class="prose">' + esc(mp.s.placement) + '</p></div>');
      if (mp.s.xpFarm) extra.push('<div><div class="lbl">XP farming here</div><p class="prose">' + esc(mp.s.xpFarm) + '</p></div>');
      if (extra.length) html += '<div class="two">' + extra.join('') + '</div>';
    }
    html += '</section>';

    /* C. cash and build */
    html += '<section class="card" aria-labelledby="hC"><div class="card-h"><h2 id="hC">Cash and build order</h2><span class="subtle">' + esc(((D.economy.playstyles || []).find(function (p) { return p.id === S.playstyle; }) || {}).name || '') + ' order · ' + esc(mode.name) + ' prices</span></div>';
    html += '<div class="legend"><span><i style="background:var(--cash)"></i>Cash available at the start of the round' + (mode.rules && mode.rules.noIncome ? ' (flat: Deflation has no income)' : '') + '</span><span><i style="background:var(--accent)"></i>Spent so far</span><span><i style="background:var(--crit);width:8px;height:8px;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)"></i>Danger round</span></div>';
    html += '<div class="chart-wrap">' + chartSvg(build, mode, rounds) + '</div>';
    if (S.picks.length || hero) {
      html += '<div class="donechips">' + build.completes.map(function (c) {
        return '<span class="dchip' + (c.ok ? '' : ' bad') + '">' + esc(c.towerName) + ' #' + (c.inst + 1) + ' <b class="mono">' + esc(c.target) + '</b> ' + (c.ok ? 'done <b class="mono">R' + c.round + '</b>' : 'not affordable by R' + range[1]) + '</span>';
      }).join('') + '</div>';
      if (build.unaffordable.length) html += '<p class="callout" style="background:var(--crit-soft)">' + build.unaffordable.length + ' purchase' + (build.unaffordable.length > 1 ? 's' : '') + ' cannot be paid for by R' + range[1] + '. The build costs ' + L.money(build.totalWanted) + ' and this mode gives ' + L.money(build.endAvail) + ' without income towers.</p>';
      html += '<div class="tbl-wrap scroll"><table><thead><tr><th>Round</th><th>Purchase</th><th class="n">Cost</th><th class="n">Spent</th><th class="n">Bank after</th></tr></thead><tbody>' +
        build.rows.map(function (r) {
          var what = r.kind === 'hero' ? esc(r.towerName) + ' <span class="subtle">(hero)</span>' : r.kind === 'place' ? 'Place ' + esc(r.towerName) + ' #' + (r.inst + 1) : esc(r.towerName) + ' #' + (r.inst + 1) + ' → <span class="mono">' + esc(r.code) + '</span> ' + esc(r.name);
          return '<tr class="' + (r.round == null ? 'flag' : '') + '"><td class="rnd">' + (r.round == null ? (r.flag === 'blocked' ? 'blocked' : 'never') : 'R' + r.round) + '</td><td>' + what + '</td><td class="n">' + L.money(r.cost) + '</td><td class="n">' + (r.round == null ? '–' : L.money(r.cum)) + '</td><td class="n">' + (r.round == null ? '–' : L.money(r.bank)) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else html += '<p class="empty">Add towers to see a build order.</p>';
    html += '<p class="subtle">Each step lands on the first round whose starting cash covers everything bought so far. Tower income, selling and Monkey Knowledge cash are not added to the curve.</p>';
    html += '</section>';

    /* D. XP */
    html += '<section class="card" aria-labelledby="hD"><div class="card-h"><h2 id="hD">Tower XP</h2><span class="subtle">split by cash invested each round; hero takes none</span></div>';
    if (L.isSandbox(mode)) html += '<p class="callout">Sandbox pays no XP.</p>';
    else {
      var parts = [L.int(xp.base) + ' base (R' + range[0] + '–' + range[1] + ')', '×' + xp.mapMult.toFixed(1) + ' ' + esc(map.difficulty)];
      if (xp.meMult > 1) parts.push('×1.08 Monkey Education');
      var fpNote = xp.freeplayTo > range[1] ? ' + freeplay to R' + xp.freeplayTo + ' at ' + (range[1] < 100 ? '30% to R100, 10% after' : '10%') : '';
      html += '<p class="xpline">One run: ' + parts.join(' ') + fpNote + ' = <b>' + L.int(xp.total) + ' XP</b> to share.' + (xp.emtMult > 1 ? ' Military towers then get ×1.05 from Elite Military Training.' : '') + (xp.lost > 0.5 ? ' <span style="color:var(--warn)">' + L.int(xp.lost) + ' XP is lost on rounds where nothing is built yet.</span>' : '') + '</p>';
      var ids = Object.keys(xp.perTower);
      if (ids.length) {
        html += '<div class="split" role="img" aria-label="XP share by tower">' + ids.map(function (id, k) { return '<span style="width:' + (xp.perTower[id].share * 100).toFixed(2) + '%;background:' + SPLIT_COLORS[k % SPLIT_COLORS.length] + '" title="' + esc(tname(id)) + '"></span>'; }).join('') + '</div>';
        html += '<div class="split-l">' + ids.map(function (id, k) { var p = xp.perTower[id]; return '<span><i style="background:' + SPLIT_COLORS[k % SPLIT_COLORS.length] + '"></i>' + esc(tname(id)) + ' ' + (p.share * 100).toFixed(1) + '% · <b class="num">' + L.int(p.xp) + '</b> XP</span>'; }).join('') + '</div>';
      }
      var lv = S.picks.filter(function (p) { return p.level; });
      if (!lv.length) html += '<p class="empty">Tick "Levelling this tower" on a tower to see runs to its next tier, all T5s and Paragon.</p>';
      lv.forEach(function (p) {
        var t = L.towerById(D, p.id); if (!t) return;
        var mine = xp.perTower[p.id] || { xp: 0, share: 0 };
        var plan = L.levelPlan(D, p.id, p.banked, mine.xp);
        var goal = function (key, label, g, sub, total) {
          if (!g) return '';
          var pct = total ? Math.min(100, (p.banked || 0) / total * 100) : 0;
          return '<div class="goal' + (p.target === key ? ' target' : '') + '"><div class="gl">' + label + (p.target === key ? '<span style="color:var(--accent)">target</span>' : '') + '</div><div class="gv">' + L.runs(g.runs) + ' <small>' + (g.runs === 0 ? '' : 'runs') + '</small></div><div class="gs">' + sub + '</div>' + (total ? '<div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div>' : '') + '</div>';
        };
        html += '<div class="lvcard"><div class="lvtop"><h3>' + esc(t.name) + '</h3><div class="big">' + L.int(mine.xp) + ' <small>XP per run · ' + (mine.share * 100).toFixed(1) + '% of the cash</small></div></div>';
        html += '<div class="goals">' +
          goal('next', 'Next tier', plan.next ? plan.next : { runs: 0 }, plan.next ? esc(plan.next.name) + ' <span class="mono">' + plan.next.code + '</span> · ' + L.int(plan.next.need) + ' XP to go' : 'Every upgrade unlocked', null) +
          goal('t5', 'All T5s', plan.allT5, L.int(plan.allT5.need) + ' of ' + L.int(plan.allT5.total) + ' XP to go', plan.allT5.total) +
          (plan.paragon ? goal('paragon', 'Paragon', plan.paragon, esc(plan.paragon.name) + ' · ' + L.int(plan.paragon.need) + ' of ' + L.int(plan.paragon.total) + ' XP to go', plan.paragon.total) : '<div class="goal"><div class="gl">Paragon</div><div class="gs">' + esc(t.name) + ' has no Paragon.</div></div>') +
          '</div>';
        var cmp = L.farmCompare(D, p.id, mine.share, { me: S.me, emt: S.emt });
        var tgtNeed = p.target === 'paragon' && plan.paragon ? plan.paragon.need : p.target === 't5' ? plan.allT5.need : plan.next ? plan.next.need : 0;
        var tgtLabel = p.target === 'paragon' ? 'Paragon' : p.target === 't5' ? 'all T5s' : 'next tier';
        html += '<div class="tbl-wrap"><table><thead><tr><th>Best farms</th><th>Rounds</th><th class="n">Your split (' + (mine.share * 100).toFixed(0) + '%)</th><th class="n">Mono (100%)</th><th class="n">Runs to ' + tgtLabel + '</th></tr></thead><tbody>' +
          cmp.map(function (c) { return '<tr class="' + (c.modeId === mode.id && map.difficulty === 'Expert' ? 'hi' : '') + '"><td>' + esc(c.label) + '</td><td class="rnd">' + c.rounds + '</td><td class="n">' + L.int(c.yours) + '</td><td class="n">' + L.int(c.mono) + '</td><td class="n">' + L.runs(c.yours > 0 ? tgtNeed / c.yours : Infinity) + ' / ' + L.runs(tgtNeed / c.mono) + '</td></tr>'; }).join('') +
          '</tbody></table></div>';
        html += '<p class="subtle">"Mono" means every dollar on the map is in ' + esc(t.name) + 's, so it takes 100% of the XP. Hard and Impoppable need a full defence to reach the end, and any helper towers take their cash share, so the mono column is the ceiling, not a promise. Hard and Impoppable runs also take far longer than a 30-round Deflation.' + (plan.missingXp ? ' ' + plan.missingXp + ' upgrade XP value(s) are unknown and counted as 0.' : '') + (t.class === 'Military' && S.emt ? ' Elite Military Training also gave a one-off +1,000 XP; include it in "XP so far".' : '') + '</p>';
        html += '</div>';
      });
      if (lv.length) html += '<p class="subtle">"XP so far" is everything this tower has earned, spent on unlocks plus unspent. "Next tier" follows the cheapest-first unlock order. Paragon totals include every upgrade plus the Paragon unlock.</p>';
    }
    html += '</section>';

    /* E. playstyle and economy */
    var ps = (D.economy.playstyles || []).find(function (p) { return p.id === S.playstyle; });
    html += '<section class="card" aria-labelledby="hE"><div class="card-h"><h2 id="hE">Playstyle and economy</h2>' + (ps ? '<span class="subtle">best for ' + esc((ps.bestFor || []).join(', ')) + '</span>' : '') + '</div>';
    if (ps) {
      html += '<div class="two"><div><div class="lbl">' + esc(ps.name) + ' template</div><p class="prose">' + esc(ps.template) + '</p></div><div><div class="lbl">Risks</div><p class="prose">' + esc(ps.risks) + '</p>' + (ps.cashCurve ? '<p class="prose subtle" style="margin-top:6px">' + esc(ps.cashCurve) + '</p>' : '') + '</div></div>';
    }
    var inc = L.incomeRows(D, mode);
    var okInc = inc.filter(function (r) { return r.status === 'ok'; });
    var specialInc = inc.filter(function (r) { return r.status === 'special'; });
    html += '<div class="lbl">Income sources in ' + esc(mode.name) + '</div>';
    if (mode.rules && mode.rules.noIncomeTowers) html += '<p class="callout">' + esc(mode.name) + ' bans Banana Farms and pays no income from any tower. Spend on defence only.</p>';
    else if (mode.rules && mode.rules.noIncome) html += '<p class="callout">Deflation pays no income: farms, Supply Drop and banks make nothing.' + (specialInc.length ? ' Exception (v57): ' + specialInc.map(function (r) { return esc(r.tower + ' ' + r.code); }).join(', ') + ' still turns pops into cash here.' : '') + '</p>';
    if (okInc.length) {
      html += '<div class="tbl-wrap scroll"><table><thead><tr><th>Source</th><th class="n">Cost ≈</th><th class="n">$/round</th><th class="n">Payback</th><th class="n">Buy by</th></tr></thead><tbody>' +
        okInc.map(function (r) { var late = r.lastBuy != null && r.lastBuy < range[0]; return '<tr' + (late ? ' class="flag"' : '') + '><td>' + esc(r.tower) + ' <span class="mono">' + esc(r.code) + '</span></td><td class="n">' + L.money(r.cost) + '</td><td class="n">' + (r.income ? L.money(r.income) : '–') + '</td><td class="n">' + (r.payback ? r.payback.toFixed(1) + ' rds' : '–') + '</td><td class="n">' + (r.lastBuy != null ? 'R' + r.lastBuy : '–') + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="subtle">"Buy by" is the last round a purchase still pays for itself by R' + range[1] + '. Costs are the Medium total times ×' + mode.costMult + ', so they can be a few dollars off the in-game price.' + (mode.cashMult !== 1 ? ' Income is halved in this mode.' : '') + '</p>';
    }
    var dps = L.dpsRows(D, S.picks);
    if (dps.length) {
      html += '<div class="lbl">DPS per $1,000 (Medium prices)</div><div class="tbl-wrap"><table><thead><tr><th>Build</th><th class="n">Cost</th><th class="n">vs Ceramic</th><th class="n">vs MOAB</th><th class="n">DPS/$1k</th></tr></thead><tbody>' +
        dps.map(function (d) { return '<tr class="' + (d.match ? 'hi' : '') + '"><td>' + esc(d.build) + (d.match ? ' <span class="tag">your build</span>' : '') + (d.caveat ? '<br><span class="subtle">' + esc(d.caveat) + '</span>' : '') + '</td><td class="n">' + L.money(d.cost) + '</td><td class="n">' + d.dpsVsCeramic + '</td><td class="n">' + d.dpsVsMoab + '</td><td class="n"><b>' + d.dpsPerK + '</b></td></tr>'; }).join('') +
        '</tbody></table></div>';
    }
    html += '</section>';

    /* F. tower guide */
    html += '<section class="card" aria-labelledby="hF"><div class="card-h"><h2 id="hF">Tower guide</h2></div><div class="guide">';
    if (!S.picks.length) html += '<p class="empty">No towers chosen.</p>';
    S.picks.forEach(function (p) {
      var t = L.towerById(D, p.id), g = D.guides[p.id] || {};
      if (!t) return;
      var my = L.code(p.cross);
      html += '<div class="gtower"><h3>' + esc(t.name) + ' <span class="mono">' + my + '</span><span class="subtle">' + esc(t.class) + (t.paragon ? ' · Paragon: ' + esc(t.paragon.name) : '') + '</span></h3>';
      if (g.summary) html += '<p class="prose">' + esc(g.summary) + '</p>';
      var bc = g.bestCrosspaths || [];
      if (bc.length) html += '<div class="xps">' + bc.map(function (x) { return '<div class="xp' + (x.code === my ? ' match' : '') + '"><b>' + esc(x.code) + '</b> ' + (x.cost ? L.money(L.price(x.cost, mode.costMult)) + ' ' : '') + '<span class="subtle">' + esc(x.use || '') + '</span></div>'; }).join('') + '</div>';
      var cols = [];
      if ((g.synergies || []).length) cols.push('<div><div class="lbl">Synergies</div><ul>' + g.synergies.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>');
      if ((g.lacks || []).length) cols.push('<div><div class="lbl">Lacks</div><ul>' + g.lacks.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>');
      if (cols.length) html += '<div class="two">' + cols.join('') + '</div>';
      if (g.buyTiming) html += '<p class="prose"><b>Timing:</b> ' + esc(g.buyTiming) + '</p>';
      if (g.farm && g.farm.setup) html += '<p class="prose subtle"><b>Reference farm:</b> ' + esc(g.farm.map) + ', ' + esc(g.farm.mode) + ': ' + esc(g.farm.setup) + (g.farm.helpers ? ' (' + esc(g.farm.helpers) + ')' : '') + (g.farm.xpPerRun ? ' ≈ ' + L.int(g.farm.xpPerRun) + ' XP/run with Monkey Education' + (t.class === 'Military' ? ' and EMT' : '') : '') + '.</p>';
      html += '</div>';
    });
    html += '</div></section>';

    $('results').innerHTML = html;
    var meta = D.meta || {};
    $('sub').textContent = 'BTD6 v' + (meta.version || '?') + ' build, cash and tower-XP planner';
    $('foot').textContent = 'Planner ' + APP_VERSION + '. Data researched ' + (meta.researched || '?') + ' for v' + (meta.version || '?') + '. Prices are Medium × mode multiplier, rounded to the nearest $5. Grants, roles and strategy text are the dataset’s reading of wiki pages, not a game export.';
  }

  function renderAll() { renderControls(); renderResults(); save(); }
  function changed(opts) {
    if (opts && opts.controls) renderControls(); else { $('exampleTag').textContent = isExample() ? 'Example setup: Infernal Sniper farm' : 'Your setup (saved in this browser)'; $('resetBtn').disabled = isExample(); $('resetBtn').textContent = isExample() ? 'Example loaded' : 'Load example'; }
    renderResults(); save();
  }

  /* ---------- events ---------- */
  $('mapSearch').addEventListener('input', renderMapList);
  $('mapList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-map]'); if (!b) return;
    S.mapId = b.getAttribute('data-map');
    renderMapList(); changed();
  });
  $('mode').addEventListener('change', function () { S.modeId = this.value; changed({ controls: true }); });
  $('hero').addEventListener('change', function () { S.heroId = this.value; changed(); });
  $('playstyle').addEventListener('change', function () { S.playstyle = this.value; changed(); });
  $('me').addEventListener('change', function () { S.me = this.checked; changed(); });
  $('emt').addEventListener('change', function () { S.emt = this.checked; changed(); });
  $('freeplay').addEventListener('input', function () { var v = parseInt(this.value, 10); S.freeplayTo = isFinite(v) && v > 0 ? Math.min(500, v) : null; changed(); });
  $('towerChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tower]'); if (!b) return;
    var id = b.getAttribute('data-tower');
    var i = S.picks.findIndex(function (p) { return p.id === id; });
    if (i >= 0) S.picks.splice(i, 1);
    else S.picks.push({ id: id, cross: [0, 0, 0], count: 1, level: false, banked: 0, target: 'next' });
    changed({ controls: true });
  });
  $('picks').addEventListener('click', function (e) {
    var rm = e.target.closest('[data-remove]');
    if (rm) { S.picks.splice(+rm.getAttribute('data-remove'), 1); changed({ controls: true }); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var p = S.picks[+b.getAttribute('data-i')]; if (!p) return;
    var d = +b.getAttribute('data-d'), act = b.getAttribute('data-act');
    if (act === 'count') p.count = Math.max(1, Math.min(20, p.count + d));
    else { var k = +act.slice(4); p.cross = L.setPath(p.cross, k, p.cross[k] + d); }
    changed({ controls: true });
    var again = document.querySelector('#picks [data-act="' + act + '"][data-i="' + b.getAttribute('data-i') + '"][data-d="' + d + '"]');
    if (again) again.focus();
  });
  $('picks').addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-level')) { var p = S.picks[+t.getAttribute('data-level')]; if (p) { p.level = t.checked; if (p.level && !L.towerById(D, p.id).paragon && p.target === 'paragon') p.target = 'next'; } changed({ controls: true }); }
    else if (t.hasAttribute('data-tgt')) { var q = S.picks[+t.getAttribute('data-tgt')]; if (q) q.target = t.value; changed(); }
  });
  $('picks').addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-bank')) { var p = S.picks[+t.getAttribute('data-bank')]; if (p) p.banked = Math.max(0, +t.value || 0); changed(); }
  });
  $('resetBtn').addEventListener('click', function () { S = clone(EXAMPLE); $('mapSearch').value = ''; renderAll(); scrollMapIntoView(); });

  applyHash();
  renderAll();
  scrollMapIntoView();
  window.addEventListener('hashchange', function () { if (applyHash()) { $('mapSearch').value = ''; renderAll(); scrollMapIntoView(); } });
})();
</script>
