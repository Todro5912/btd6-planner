<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="noindex">
{% if keep_hash %}<script>location.replace({{ (root ~ target)|tojson }} + location.search + location.hash);</script>{% endif %}
<meta http-equiv="refresh" content="0; url={{ root }}{{ target }}">
<link rel="canonical" href="{{ site.siteUrl }}{{ target }}">
</head>
<body>
<p><a href="{{ root }}{{ target }}">{{ label or 'Continue' }}</a></p>
</body>
</html>
